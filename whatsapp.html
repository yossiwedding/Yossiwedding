<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Yossi’s wedding</title>
<style>
  :root { --bg:#faf6f0; --fg:#2b2622; --accent:#b5651d; --card:#fff; --line:#e3d9cc; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1a17; --fg:#f2ece4; --accent:#e0a064; --card:#27231f; --line:#3a342d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: Georgia, 'Times New Roman', serif; line-height:1.5; }
  main { max-width:480px; margin:0 auto; padding:48px 20px; text-align:center; }
  h1 { font-size:2rem; margin:0 0 8px; }
  .date { font-size:1.25rem; color:var(--accent); margin:0 0 32px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; text-align:left; }
  label { display:block; font-weight:bold; margin-bottom:6px; }
  input[type=text] { width:100%; padding:12px; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .choices { display:flex; gap:10px; margin:20px 0; }
  .choices label { flex:1; margin:0; font-weight:normal; }
  .choices input { position:absolute; opacity:0; }
  .choices span { display:block; text-align:center; padding:12px 8px; border:1px solid var(--line); border-radius:8px; cursor:pointer; }
  .choices input:checked + span { background:var(--accent); color:#fff; border-color:var(--accent); }
  button { width:100%; padding:14px; font-size:1rem; border:0; border-radius:8px; background:#1fa855; color:#fff; cursor:pointer; }
</style>
</head>
<body>
<main>
  <h1>Yossi’s wedding is coming up</h1>
  <p class="date">December 21</p>

  <form>
    <label for="name">Your name</label>
    <input type="text" id="name" name="name" required autocomplete="name">

    <div class="choices">
      <label><input type="radio" name="answer" value="I'm coming" required><span>I’m coming</span></label>
      <label><input type="radio" name="answer" value="I can't make it"><span>I can’t make it</span></label>
    </div>

    <button type="button" id="wa">Send on WhatsApp</button>
  </form>
</main>
<script>
  var WA_NUMBER = "18455984158";
  document.getElementById("wa").addEventListener("click", function () {
    var form = document.querySelector("form");
    if (!form.reportValidity()) return;
    var name = form.elements["name"].value;
    var answer = form.elements["answer"].value;
    var text = "Wedding RSVP: " + name + " – " + answer;
    window.location.href = "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(text);
  });
</script>
</body>
</html>
