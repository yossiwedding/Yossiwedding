<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yossi and Simi's Wedding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b1a33;
      --navy-light: #13264a;
      --gold: #c9a45c;
      --gold-light: #e3c88f;
      --cream: #f4ecd8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      color: var(--cream);
      background: radial-gradient(ellipse at top, var(--navy-light) 0%, var(--navy) 65%);
      background-attachment: fixed;
      text-align: center;
      overflow-x: hidden;
    }
    main { max-width: 480px; margin: 0 auto; padding: 48px 22px 70px; }

    /* ---------- Monogram ---------- */
    .logo { width: 210px; height: 210px; margin: 0 auto 10px; display: block; }
    .ring {
      fill: none; stroke: var(--gold); stroke-width: 1.5;
      stroke-dasharray: 590; stroke-dashoffset: 590;
      transform: rotate(-90deg); transform-origin: 100px 100px;
      animation: draw 1.6s ease-in-out 2.1s forwards;
    }
    .piece {
      fill: var(--gold);
      opacity: 0;
      animation: assemble 1.3s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .p1 { --x: -90px; --y: -70px; --r: -40deg; animation-delay: .2s; }
    .p2 { --x: 90px;  --y: -80px; --r: 50deg;  animation-delay: .4s; }
    .p3 { --x: 0px;   --y: 110px; --r: 25deg;  animation-delay: .6s; }
    .p4 { --x: -100px; --y: 60px; --r: -55deg; animation-delay: .8s; }
    .p5 { --x: 100px; --y: 70px;  --r: 40deg;  animation-delay: 1.0s; }
    .p6 { --x: 20px;  --y: -110px; --r: -30deg; animation-delay: 1.2s; }
    @keyframes assemble {
      0%   { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(.4); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: translate(0,0) rotate(0) scale(1); }
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    /* ---------- Text reveals ---------- */
    .reveal { opacity: 0; transform: translateY(14px); animation: rise 1s ease forwards; }
    @keyframes rise { to { opacity: 1; transform: translateY(0); } }
    .d1 { animation-delay: 3.0s; }
    .d2 { animation-delay: 3.4s; }
    .d3 { animation-delay: 3.8s; }
    .d4 { animation-delay: 4.2s; }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      font-size: 2.5rem;
      line-height: 1.1;
      margin: 8px 0 6px;
      color: var(--gold-light);
    }
    .sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.3rem; color: var(--cream); margin: 0; }
    .date { margin-top: 18px; font-size: 1.05rem; letter-spacing: .18em; color: var(--gold); }
    #countdown { margin-top: 10px; font-size: .95rem; color: var(--cream); opacity: .85; }

    .divider { width: 70px; height: 1px; background: var(--gold); margin: 34px auto; border: 0; }

    /* ---------- RSVP ---------- */
    .rsvp {
      border: 1px solid rgba(201,164,92,.55);
      border-radius: 4px;
      padding: 30px 22px;
      background: rgba(255,255,255,.03);
    }
    .rsvp h2 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: 1.8rem; margin: 0 0 18px; color: var(--gold-light); }
    input {
      width: 100%; padding: 14px; font-family: inherit; font-size: 1rem; font-weight: 300;
      color: var(--cream); background: transparent;
      border: 0; border-bottom: 1px solid var(--gold); border-radius: 0;
      margin-bottom: 24px; text-align: center; outline: none;
    }
    input::placeholder { color: rgba(244,236,216,.55); }
    input:focus { border-bottom-color: var(--gold-light); box-shadow: 0 1px 0 var(--gold-light); }
    button {
      display: block; width: 100%; padding: 14px 16px; margin: 10px 0 0;
      font-family: inherit; font-size: 1rem; font-weight: 400; cursor: pointer;
      border-radius: 2px; transition: background .25s, color .25s;
    }
    button:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }
    .yes { background: var(--gold); color: var(--navy); border: 1px solid var(--gold); }
    .yes:hover { background: var(--gold-light); }
    .no { background: transparent; color: var(--cream); border: 1px solid rgba(201,164,92,.6); }
    .no:hover { background: rgba(201,164,92,.12); }
